name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected a semantic version tag such as v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate GameMaker paths
        run: python3 .github/scripts/validate-gamemaker-paths.py

      - name: Verify release tag does not exist
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi

      - name: Build Linux AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npx --yes @gamemaker/gm-cli@2.3.0 package \
            --target=linux \
            --runtime=vm \
            --toolchain-options '{"linux":{"packageType":"appimage"}}' \
            --output="release-assets/PocketCrystalLeague-${RELEASE_TAG}.AppImage"

          appimage=$(find release-assets -maxdepth 1 -type f -iname '*.AppImage' -print -quit)
          if [[ -z "$appimage" ]]; then
            echo "ERROR: GameMaker did not produce an AppImage."
            find . -maxdepth 4 -type f | sort | tail -200
            exit 1
          fi

          mv "$appimage" "release-assets/PocketCrystalLeague-${RELEASE_TAG}.AppImage"
          chmod +x "release-assets/PocketCrystalLeague-${RELEASE_TAG}.AppImage"
          sha256sum "release-assets/PocketCrystalLeague-${RELEASE_TAG}.AppImage" > release-assets/SHA256SUMS

      - name: Build source archive
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          name="PocketCrystalLeague-${RELEASE_TAG}"
          tar \
            --exclude=.git \
            --exclude=release-assets \
            -czf "release-assets/${name}-source.tar.gz" \
            .
          sha256sum "release-assets/${name}-source.tar.gz" >> release-assets/SHA256SUMS

      - name: Create and push release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes