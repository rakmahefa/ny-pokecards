name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected a semantic version tag such as v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            fuse_package=libfuse2t64
          else
            fuse_package=libfuse2
          fi
          sudo apt-get install -y \
            build-essential \
            clang \
            libssl-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libopenal-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            ffmpeg \
            curl \
            wget \
            pulseaudio \
            libxfixes-dev \
            "$fuse_package"

      - name: Allow unprivileged user namespaces for GameMaker
        shell: bash
        run: |
          set -euo pipefail
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install GameMaker Ubuntu packaging tools
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /opt/steam-runtime
          curl -fsSL \
            https://repo.steampowered.com/steamrt-images-scout/snapshots/latest-steam-client-general-availability/com.valvesoftware.SteamRuntime.Sdk-amd64,i386-scout-sysroot.tar.gz \
            | sudo tar -xzf - -C /opt/steam-runtime

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo install -m 0755 linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m 0755 appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

          linuxdeploy --version || true
          appimagetool --version || true

      - name: Validate GameMaker paths
        run: python3 .github/scripts/validate-gamemaker-paths.py

      - name: Verify release tag does not exist
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi

      - name: Build Linux AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npx --yes @gamemaker/gm-cli@2.3.0 package \
            PocketCrystalLeague.yyp/PocketCrystalLeague.yyp \
            --target=linux \
            --runtime=vm \
            --toolchain-options '{"linux":{"packageType":"appimage"}}' \
            --output="../release-assets/PocketCrystalLeague-${RELEASE_TAG}.AppImage"

          expected="release-assets/PocketCrystalLeague-${RELEASE_TAG}.AppImage"
          if [[ ! -f "$expected" ]]; then
            echo "ERROR: GameMaker did not produce the expected AppImage: $expected"
            find . -maxdepth 5 -type f \( -iname '*.AppImage' -o -iname '*AppImage*' \) -print
            exit 1
          fi

          chmod +x "$expected"
          sha256sum "$expected" > release-assets/SHA256SUMS

      - name: Build source archive
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          name="PocketCrystalLeague-${RELEASE_TAG}"
          tar \
            --exclude=.git \
            --exclude=release-assets \
            -czf "release-assets/${name}-source.tar.gz" \
            .
          sha256sum "release-assets/${name}-source.tar.gz" >> release-assets/SHA256SUMS

      - name: Create and push release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes
