name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${{ inputs.tag }}"
            echo "Expected a semantic version tag such as v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate GameMaker paths
        run: python .github/scripts/validate-gamemaker-paths.py

  publish:
    name: Publish GitHub release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Build source archives
        shell: bash
        run: |
          set -euo pipefail
          name="PocketCrystalLeague-${{ inputs.tag }}"
          mkdir -p release-assets
          tar \
            --exclude=.git \
            --exclude=release-assets \
            -czf "release-assets/${name}-source.tar.gz" \
            .
          (cd release-assets && sha256sum "${name}-source.tar.gz" > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${{ inputs.tag }}" \
            --generate-notes
