name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate GameMaker paths
        run: python .github/scripts/validate-gamemaker-paths.py

  linux-compile:
    name: GameMaker Linux compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Compile Linux target
        run: |
          npx @gamemaker/gm-cli@2.3.0 compile \
            PocketCrystalLeague.yyp/PocketCrystalLeague.yyp \
            --target=linux \
            --runtime=vm
